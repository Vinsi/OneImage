name: OneImageDemo
options:
  bundleIdPrefix: com.vinsi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OneImage:
    path: ../..
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
targets:
  OneImageDemo:
    type: application
    platform: iOS
    sources:
      - path: OneImageDemo
        excludes:
          - Info.plist
    dependencies:
      - package: OneImage
        product: OneImageCore
      - package: OneImage
        product: OneImageView
      - package: Kingfisher
        product: Kingfisher
    info:
      path: OneImageDemo/Info.plist
      properties:
        CFBundleDisplayName: OneImage Demo
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinsi.OneImageDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  OneImageDemo:
    build:
      targets:
        OneImageDemo: all
    run:
      config: Debug
